name: Desktop Build

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      # 单平台失败不连带取消其余平台（各平台产物独立；release 由 needs 门控）
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: desktop:build:mac
            artifact: macos
          - os: windows-latest
            script: desktop:build:win
            artifact: windows
          - os: ubuntu-latest
            script: desktop:build:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:electron
      # ubuntu-24.04：bwrap（flatpak build 内部）与非特权 userns 受限，需放开两项内核开关
      - if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # flatpak/flatpak-builder：electron-builder flatpak 目标依赖（ubuntu 镜像不含 builder）
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      # flatpak 子命令输出被 @malept/flatpak-bundler 吞进 debug() 日志（默认不可见），
      # 用 shim 强制透传落盘，失败时 dump 诊断
      - if: runner.os == 'Linux'
        run: |
          sudo mv /usr/bin/flatpak /usr/bin/flatpak.real
          printf '#!/bin/bash\n/usr/bin/flatpak.real "$@" 2>&1 | tee -a /tmp/flatpak-trace.log\nexit ${PIPESTATUS[0]}\n' | sudo tee /usr/bin/flatpak >/dev/null
          sudo chmod +x /usr/bin/flatpak
      # 桌面构建内含 Web 构建（强制置空 VITE_MAIN_API，防私有地址入包）
      - run: npm run ${{ matrix.script }}
      - if: failure() && runner.os == 'Linux'
        run: tail -80 /tmp/flatpak-trace.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: NextMusic-${{ matrix.artifact }}
          path: |
            desktop-release/*.dmg
            desktop-release/*.zip
            desktop-release/*.exe
            desktop-release/*.AppImage
            desktop-release/*.deb
            desktop-release/*.rpm
            desktop-release/*.pacman
            desktop-release/*.flatpak
            desktop-release/*.snap
          if-no-files-found: error

  verify:
    # Linux 上跑桌面冒烟 + 全量 Web 回归（Review Focus 1/2 落地）
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run desktop:build:electron
      - run: npx playwright install --with-deps chromium
      # ubuntu-24.04 runner 的 SUID sandbox 配置损坏（microsoft/playwright#34251），
      # Electron 渲染进程 sandbox 需要非特权 user namespace
      - run: sudo sysctl -w kernel.unprivileged_userns_clone=1
      # Electron 需要真实 X server（headless 不适用），无头 runner 用 xvfb 虚拟显示
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run --auto-servernum npx playwright test tests/e2e/desktop.smoke.spec.ts
      - run: npm run test

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    needs: [build, verify]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: desktop-release
      - uses: softprops/action-gh-release@v2
        with:
          files: desktop-release/*
          generate_release_notes: true
