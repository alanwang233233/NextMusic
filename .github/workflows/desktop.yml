name: Desktop Build

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: desktop:build:mac
            artifact: macos
          - os: windows-latest
            script: desktop:build:win
            artifact: windows
          - os: ubuntu-latest
            script: desktop:build:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:electron
      # 桌面构建内含 Web 构建（强制置空 VITE_MAIN_API，防私有地址入包）
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: NextMusic-${{ matrix.artifact }}
          path: |
            desktop-release/*.dmg
            desktop-release/*.zip
            desktop-release/*.exe
            desktop-release/*.AppImage
            desktop-release/*.deb
          if-no-files-found: error

  verify:
    # Linux 上跑桌面冒烟 + 全量 Web 回归（Review Focus 1/2 落地）
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run desktop:build:electron
      - run: npx playwright install --with-deps chromium
      # ubuntu-24.04 runner 的 SUID sandbox 配置损坏（microsoft/playwright#34251），
      # Electron 渲染进程 sandbox 需要非特权 user namespace
      - run: sudo sysctl -w kernel.unprivileged_userns_clone=1
      - run: npx playwright test tests/e2e/desktop.smoke.spec.ts
      - run: npm run test

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    needs: [build, verify]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: desktop-release
      - uses: softprops/action-gh-release@v2
        with:
          files: desktop-release/*
          generate_release_notes: true
